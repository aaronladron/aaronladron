name: Generate Snake

on:
  schedule:
    - cron: "0 */12 * * *"  # toutes les 12h
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: Platane/snk@v3
        id: snake-gif
        with:
          github_user_name: TON_USERNAME
          outputs: dist/snake.svg

      - uses: EndBug/add-and-commit@v9
        with:
          message: "generate snake"
          add: "dist/snake.svg"
